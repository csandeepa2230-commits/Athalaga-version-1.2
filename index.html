<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Connect directly with verified local tradesmen via WhatsApp or Direct Call. Zero commission. Puttalam, Sri Lanka." />
    <meta name="theme-color" content="#0b241e" />
    
    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/jpeg" href="/images/webappicon.jpeg" />
    <link rel="shortcut icon" type="image/jpeg" href="/images/webappicon.jpeg" />
    <link rel="apple-touch-icon" href="/images/webappicon.jpeg" />

    <!-- PWA settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Athalaga" />
    
    <!-- Open Graph tags -->
    <meta property="og:title" content="Athalaga - Find Verified Local Workers" />
    <meta property="og:description" content="Connect directly with verified local tradesmen via WhatsApp or Direct Call. Zero commission. Puttalam, Sri Lanka." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/webappicon.jpeg" />

    <title>Athalaga - Find Verified Local Workers</title>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (registration) => {
              console.log('ServiceWorker registration successful with scope: ', registration.scope);
            },
            (err) => {
              console.log('ServiceWorker registration failed: ', err);
            }
          );
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
